<!doctype html>
<html lang="{{ .Site.Language.LanguageCode | default "en-us" }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ .Description | default .Site.Params.description }}">
    <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
    <link rel="stylesheet" href="{{ "docs.css" | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="{{ .Site.Home.RelPermalink }}">Tamana<span> docs</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ .Site.Home.RelPermalink }}">Overview</a>
        <a href="{{ "quality/" | relURL }}">Quality guide</a>
        <a href="{{ "getting-started/" | relURL }}">Getting started</a>
        <a href="{{ "api/" | relURL }}">API reference</a>
        <a href="{{ .Site.Params.appURL }}">Open app <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main class="page-shell">
      {{ block "main" . }}{{ end }}
    </main>
    <footer class="site-footer">
      <span>Tamana project documentation</span>
      <span>Stage 1 · FastAPI · SQLite</span>
    </footer>
  </body>
</html>
