name: Deploy Tamana demo to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Pages
        uses: actions/configure-pages@v5
      - name: Add app and API documentation to site
        run: |
          mkdir -p _site
          cp -R code/frontend/. _site/
          mkdir -p _site/docs
          cp -R docs/. _site/docs/
          test -s _site/docs/README.md
          test -s _site/docs/api-documentation.md
          test -s _site/docs/api-documentation.pdf
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5
